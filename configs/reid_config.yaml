  interpolation: bilinear
  scale: 0.00392156862745098
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
  layout: NCHW
  dtype: float32
postprocess:
  l2_normalized_inside_model: true
  similarity_metric: cosine
matching:
  similarity_threshold: null
  threshold_status: not_calibrated
  threshold_note: C270 자체 촬영 데이터의 positive/negative 분포로 최종 보정할 것
