model:
  name: osnet_x0_25
  file: models/reid/person_reid_osnet_x0_25.onnx
  format: onnx
  opset: 17
  input_name: images
  output_name: embeddings
  input_shape:
  - batch
  - 3
  - 256
  - 128
  embedding_dimension: 512
