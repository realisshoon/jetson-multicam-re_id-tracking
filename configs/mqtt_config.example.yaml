broker:
  host: 127.0.0.1
  port: 1883
  keepalive: 60
  # 인증이 필요한 경우 값 대신 환경 변수 이름을 사용합니다.
  # username_env: MQTT_USERNAME
  # password_env: MQTT_PASSWORD

node:
  id: A

topics:
  camera_a_entry: cctv/entry
  publish: nodes/{node_id}/data
  subscribe: server/{node_id}/result
  broadcast: server/all/command
