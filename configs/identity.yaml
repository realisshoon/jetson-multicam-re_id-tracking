# Main Server identity decision policy.
# Defaults preserve the thresholds used before the identity/Journey split.
embedding:
  body_dim: 512
  face_dim: 128
  max_query_samples: 3
  min_quality: 0.0

matching:
  aggregation: best_topk_weighted
  auto_match_threshold: 0.72
  auto_new_threshold: 0.70
  best_match_threshold: 0.75
  topk_match_threshold: 0.68
  combined_match_threshold: 0.72
  review_best_threshold: 0.72
  review_combined_threshold: 0.70
  margin_threshold: 0.05
  single_candidate_margin_pass: true
  review_top_k: 3
  body_weight: 0.8
  face_weight: 0.2
  min_consistent_body_frames: 2
  min_consistent_face_frames: 2
  auto_decision_min_body_quality: 0.80
  auto_decision_min_face_quality: 0.70

gallery:
  max_samples_per_modality: 8
  duplicate_similarity: 0.97
  min_sample_quality: 0.70
  promote_best_threshold: 0.80
  promote_topk_threshold: 0.72
  promote_aggregate_threshold: 0.72
  promote_combined_threshold: 0.76

topology:
  camera_c_enabled: true
