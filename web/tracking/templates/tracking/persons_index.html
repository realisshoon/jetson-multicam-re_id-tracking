{% load static %}<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전체 데이터 조회 · 열정강혁 통합관제</title>
<link rel="stylesheet" href="{% static 'tracking/journey_pages.css' %}">
<style>
.person-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:12px;padding:14px}
.person-card{display:flex;flex-direction:column;background:var(--panel-2);
  border:1px solid var(--rule);border-radius:5px;overflow:hidden;text-decoration:none;
  transition:border-color .14s}
.person-card:hover{border-color:var(--calm)}
.person-card img,.person-card .pc-noimg{width:100%;height:150px;object-fit:cover;background:#000}
.person-card .pc-noimg{display:grid;place-items:center;font-family:var(--mono);
  font-size:11px;color:var(--dimmer)}
.pc-body{padding:9px 10px;display:flex;flex-direction:column;gap:4px}
.pc-id{font-family:var(--mono);font-weight:700;font-size:14.5px;color:var(--text)}
.pc-meta{font-family:var(--mono);font-size:11px;color:var(--dimmer)}
.pc-badges{display:flex;gap:6px;flex-wrap:wrap}
.pc-badge{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:3px;
  font-weight:600;white-space:nowrap}
.pc-badge.confirmed,.pc-badge.ACTIVE{background:#264d33;color:var(--ok)}
.pc-badge.unconfirmed,.pc-badge.IDENTITY_PENDING{background:var(--panel-3);color:var(--dimmer)}
.pc-badge.REVIEW_REQUIRED{background:#4a3312;color:var(--warn)}
.count-pill{font-family:var(--mono);font-size:12px;color:var(--dimmer)}
.source-note{font-family:var(--mono);font-size:11.5px;color:var(--dimmer);padding:0 14px 12px}
#status-filter{background:var(--panel-3);color:var(--text);border:1px solid var(--rule-2);
  border-radius:3px;padding:5px 9px;font-size:12.5px}
</style>
</head>
<body>

<div class="bar">
  <div class="brand"><a href="{% url 'dashboard' %}" title="대시보드"><img class="brand-logo"
    src="{% static 'tracking/logo_ver2.png' %}" alt="WOODIGANI"></a></div>
  <div class="page-title">전체 데이터 조회</div>
  <div class="spacer"></div>
  <span class="count-pill" id="person-count"></span>
  <a class="back-link" href="{% url 'dashboard' %}">← 대시보드</a>
</div>

<section class="panel">
  <h2>
    <span>인물 목록 <span id="h-count">0</span></span>
    <select id="status-filter">
      <option value="">전체</option>
      <option value="ACTIVE">활성</option>
      <option value="IDENTITY_PENDING">신원 확인 중</option>
      <option value="REVIEW_REQUIRED">검토 필요</option>
    </select>
  </h2>
  <div class="person-grid" id="person-grid">
    <p class="empty">불러오는 중…</p>
  </div>
  <div class="source-note" id="source-note"></div>
</section>

<script>
function esc(s){return String(s??'').replace(/[&<>"]/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function personCardHTML(p){
  const img = p.thumb_url
    ? `<img src="${esc(p.thumb_url)}" alt="" loading="lazy">`
    : `<div class="pc-noimg">NO IMG</div>`;
  // status(메인 서버 판정) 가 있으면 그걸 분류 기준으로, 없으면(메인 오프라인
  // 폴백) 로컬 confirmed 기준으로 배지를 그린다.
  const badgeClass = p.status || (p.confirmed ? 'confirmed' : 'unconfirmed');
  return `<a class="person-card" href="/persons/${encodeURIComponent(p.person_uid)}/">
    ${img}
    <div class="pc-body">
      <div class="pc-id">${esc(p.person_uid)}</div>
      <div class="pc-badges">
        <span class="pc-badge ${esc(badgeClass)}">${esc(p.status_label)}</span>
      </div>
      <div class="pc-meta">${p.label ? esc(p.label)+' · ' : ''}방문 ${p.visit_count ?? '—'}회</div>
      <div class="pc-meta">최근 ${esc(p.last_seen || '—')}</div>
    </div>
  </a>`;
}

let currentFilter = '';
let lastResults = [];

function renderGrid(){
  const grid = document.getElementById('person-grid');
  const list = currentFilter ? lastResults.filter(p => p.status === currentFilter) : lastResults;
  document.getElementById('h-count').textContent = list.length;
  grid.innerHTML = list.length
    ? list.map(personCardHTML).join('')
    : '<p class="empty">해당하는 인물이 없다.</p>';
}

document.getElementById('status-filter').addEventListener('change', ev => {
  currentFilter = ev.target.value;
  renderGrid();
});

async function poll(){
  let data;
  try{ data = await (await fetch('/api/persons/list/')).json(); }
  catch(e){ return; }
  lastResults = data.results;
  document.getElementById('person-count').textContent = `총 ${data.results.length}명`;
  document.getElementById('source-note').textContent = data.source === 'main'
    ? '메인 서버(실시간 신원 DB) 기준 목록이다.'
    : '메인 서버에 연결이 안 돼 이 대시보드가 아는 인물만 보여준다.';
  renderGrid();
}
poll(); setInterval(poll, 5000);
</script>
</body>
</html>
